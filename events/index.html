  FACERINNA — Events
  Lives at my.facerinna.com/events/ and is linked from the booth header.

  WHERE THE CONTENT COMES FROM
  ----------------------------
  A Google Sheet, read live in the browser. Editing the sheet changes this
  page; nothing is rebuilt or redeployed. Columns are read BY NAME from the
  header row, so columns may be reordered or added without touching this file.

    show  event  brand  start_date  end_date  time  location
    highlight  highlight_time  details  image_url  action_label  action_url
    start_time  attendees

  THUMBNAILS
  ----------
  image_url takes either a full https URL or a path relative to this page.
  Put a file in events/img/ and write "img/pdm-agm.jpg" in the cell. A row
  with no image gets the brand gradient instead, which is a deliberate look
  rather than a broken one. See img/README.md.

  start_time is optional, 24h HH:MM, and only drives the countdown. The `time`
  column stays display text ("8.00 am - 5.30 pm"); parsing that would guess.
  attendees is optional and only renders when the column carries a value.

  Dates are YYYY-MM-DD. Leave both blank for an event whose dates are not
  settled: it renders under "Dates not fixed yet" rather than vanishing.
  Set show to FALSE to hide a row without deleting it.

  Share the sheet as "Anyone with the link, VIEWER". Its id appears
  in this page's source, as it must for a browser to fetch it, so the sheet
  must never be shared as Editor.

  IF THE SHEET CANNOT BE REACHED
  ------------------------------
  Booth wifi fails, and an events board that renders empty is worse than one
  that is slightly stale. The rows below are baked in as a fallback and shown
  with an honest "offline copy" notice, so the screen is never blank.
-->

    --bg:#0E1A26; --surface:#152634; --surface-2:#1B3040; --line:#26404F;
    --ink:#E7F0F7; --ink-2:#A9C0D2; --muted:#7C96A9; --brand-soft:#1D3F5C;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
    --shadow-md:0 10px 30px rgba(0,0,0,.4), 0 2px 6px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1A26; --surface:#152634; --surface-2:#1B3040; --line:#26404F;
  --ink:#E7F0F7; --ink-2:#A9C0D2; --muted:#7C96A9; --brand-soft:#1D3F5C;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  --shadow-md:0 10px 30px rgba(0,0,0,.4), 0 2px 6px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}

/* ---- header ---- */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:var(--maxw);margin:0 auto;padding:12px 24px;display:flex;align-items:center;
  gap:16px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;
  font-size:.86rem;font-weight:600;color:var(--brand-deep);background:var(--brand-soft);
  text-decoration:none;transition:.2s;white-space:nowrap}
.back:hover{background:var(--brand);color:#fff}
.top h1{margin:0;font-family:'Fraunces',Georgia,serif;font-weight:600;
  font-size:clamp(1.05rem,2.4vw,1.35rem);letter-spacing:.01em;min-width:0}
.feed{margin-left:auto;display:inline-flex;align-items:center;gap:8px;font-size:.76rem;
  color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:0 0 auto}
.feed.live .dot{background:#1baf7a}
.feed.stale .dot{background:var(--gold)}
.refresh{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
  border-radius:999px;padding:5px 11px;font:inherit;font-size:.76rem;cursor:pointer;transition:.2s}
.refresh:hover{border-color:var(--brand);color:var(--brand-deep)}

/* ---- intro ---- */
.intro{padding:38px 0 8px}
.intro h2{margin:0 0 8px;font-family:'Fraunces',Georgia,serif;font-weight:600;
  font-size:clamp(1.7rem,4.4vw,2.5rem);line-height:1.15}
.intro p{margin:0;color:var(--ink-2);max-width:56ch;line-height:1.6}

/* ---- group heading ---- */
.group{margin:38px 0 16px;display:flex;align-items:baseline;gap:12px}
.group h3{margin:0;font-size:.78rem;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted)}
.group .rule{flex:1;height:1px;background:var(--line);min-width:0}

/* ---- card grid ---- */
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
  padding-bottom:8px}
/* A single card in a wide grid track stretches to the full row and looks
   broken; capping it keeps one event the same shape as four. */
.grid>.card{max-width:520px;width:100%}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:22px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;
  transition:transform .25s,box-shadow .25s;
  opacity:0;transform:translateY(20px) scale(.96);filter:blur(6px);
  animation:rise .55s cubic-bezier(.22,1,.36,1) forwards}
@keyframes rise{to{opacity:1;transform:none;filter:blur(0)}}
@media(prefers-reduced-motion:reduce){
  .card{animation:none;opacity:1;transform:none}
  .card:hover{transform:none}
}
.card:hover{transform:translateY(-6px) scale(1.02);box-shadow:var(--shadow-md)}

/* ---- spotlight glow -------------------------------------------------
   A light source follows the pointer and every card lights the part of its
   border nearest to it, so the grid reads as one surface under one lamp.

   Two things the reference component does are left out on purpose:

   touch-action:none would stop a drag on a card from scrolling the page.
   On a booth touchscreen, where the cards ARE most of the page, that makes
   the events board unscrollable. It buys nothing here: the glow is driven
   by pointermove, which needs no gesture claim.

   background-attachment:fixed carries a shared viewport coordinate into
   every card. It is the neat trick in the original, but it stops working
   inside an element with a filter, and these cards animate in through
   filter:blur. Each card is given the pointer in its OWN coordinates
   instead, which survives filters and transforms.

   The glow stays hidden until a real pointer moves, so a touch device is
   not left with a lamp stuck in the top-left corner. */
.card{position:relative}
.card::before,.card::after{content:"";position:absolute;inset:-1px;border-radius:inherit;
  pointer-events:none;opacity:0;transition:opacity .35s}
:root.lamp .card::before,:root.lamp .card::after{opacity:1}
/* the ring: a radial wash clipped to the border by two masks that intersect */
.card::before{padding:1px;
  background:radial-gradient(150px 150px at var(--gx,50%) var(--gy,50%),
    hsl(var(--hue,205) 90% 62%), transparent 72%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  filter:brightness(1.15)}
/* the wash inside the card, kept faint so text stays the loudest thing */
.card::after{background:radial-gradient(190px 190px at var(--gx,50%) var(--gy,50%),
  hsl(var(--hue,205) 90% 62% / .10), transparent 70%)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .card::after{
    background:radial-gradient(190px 190px at var(--gx,50%) var(--gy,50%),
      hsl(var(--hue,205) 90% 62% / .18), transparent 70%)}
}
:root[data-theme="dark"] .card::after{
  background:radial-gradient(190px 190px at var(--gx,50%) var(--gy,50%),
    hsl(var(--hue,205) 90% 62% / .18), transparent 70%)}
/* the card's own content sits above both layers */
.card > *{position:relative;z-index:1}
@media (prefers-reduced-motion:reduce){
  .card::before,.card::after{transition:none}
}
/* A coarse pointer never produces the hover the glow is built around. */
@media (pointer:coarse){
  :root.lamp .card::before,:root.lamp .card::after{opacity:0}
}
.banner{isolation:isolate}
.card.past{opacity:.72}
.card.past:hover{opacity:1}

/* The head is a plain block now that the date has moved into the meta list.
   .lede carried min-width:0 to stop it shoving the date block off a narrow
   phone; with nothing beside it that rule does nothing at all, and what
   actually keeps a long unbroken event name inside the card is the
   overflow-wrap below. */
.card-head h4{margin:0;font-size:1.12rem;font-weight:700;line-height:1.3;
  font-family:'Fraunces',Georgia,serif;overflow-wrap:anywhere}
.card-head .brandline{margin:5px 0 0;font-size:.82rem;color:var(--ink-2);line-height:1.45}

/* The date is a meta row now, so it wants the weight of a fact rather than
   the weight of a headline: same size as the venue above it, ink rather than
   the muted grey the other rows use, so the eye still stops on it. The old
   .datebox rules went with the block -- nothing renders that class any
   more, and leaving dead selectors behind is how a stylesheet stops being
   readable. */
.meta .row.when span{color:var(--ink);font-weight:600}

/* 16/9 until the artwork says otherwise. --ar is set from the image's own
   proportions once it loads, so a square poster gets a square thumbnail and a
   portrait one gets a portrait thumbnail instead of being trimmed to a letter
   slot. Clamped at both ends: a panorama stops at 16/9 and a tall poster
   stops at 18/25, because a thumbnail taller than that stops being a
   thumbnail and pushes everything else on the card below the fold. The cards
   are grid items whose contents already differ in height, so a taller banner
   costs the layout nothing it was not already handling. */
.banner{margin:18px 0;aspect-ratio:var(--ar,16/9);width:100%;border-radius:12px;
  overflow:hidden;
  position:relative;background:linear-gradient(130deg,var(--brand-soft),var(--surface-2))}
/* The gradient placeholder has no artwork to take its shape from. */
.banner.ph{aspect-ratio:16/9}
/* A poster out of the sheet is whatever shape whoever made it chose --
   square, 4:5, portrait -- and object-fit:cover in a 16/9 box threw most of a
   square one away: the middle band survived, the top and bottom did not, and
   a poster is usually where the title and the date live. The artwork is
   fitted whole to the thumbnail now, and a blurred, over-scaled copy of
   itself fills whatever the fit leaves over, so the box is never empty at the
   sides. A landscape image still fills the frame edge to edge -- contain and
   cover agree at 16/9 -- so nothing changes for one that already fitted.
   Every card keeps the same height either way: the box is what is fixed, not
   the picture inside it. */
.banner img{position:absolute;inset:0;width:100%;height:100%;display:block}
.banner img.fg{object-fit:contain}
/* With the box taking the artwork's shape the fill is usually invisible --
   it only shows where the clamp bit. It stays because that is exactly the
   case that would otherwise letterbox onto flat grey. */
.banner img.bg{object-fit:cover;filter:blur(22px) saturate(1.3);
  transform:scale(1.16);transition:transform .3s}
/* The hover zoom moved to the blurred fill. On the artwork it would push the
   edges out of a box that is now sized to hold them. */
.card:hover .banner img.bg{transform:scale(1.24)}
/* No artwork in the sheet yet, so the placeholder has to carry the card on
   its own rather than look like a failed image. */
.banner.ph{display:grid;place-items:center;
  background:linear-gradient(130deg,var(--brand) 0%,var(--brand-deep) 55%,var(--navy) 100%)}
.banner.ph .mark{font-family:'Fraunces',Georgia,serif;font-weight:600;color:#fff;
  font-size:clamp(1rem,3.4vw,1.4rem);letter-spacing:.2em;text-transform:uppercase;
  opacity:.92;text-align:center;padding:0 18px;line-height:1.4}
.banner .tag{position:absolute;top:12px;left:12px;z-index:2;padding:5px 11px;border-radius:999px;
  font-size:.68rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  background:rgba(255,255,255,.92);color:var(--navy)}
.banner .tag.live{background:#1baf7a;color:#fff}
.banner .tag.soon{background:var(--gold);color:#241a00}
/* Sits top-right so it never collides with the status tag on the left. */
.banner .urgent{position:absolute;top:12px;right:12px;z-index:2;padding:5px 11px;
  border-radius:999px;font-size:.68rem;font-weight:700;letter-spacing:.05em;
  background:#d03b3b;color:#fff}
/* A photo darkens towards the bottom so a caption over it stays readable, and
   so a bright thumbnail does not fight the white card under it. Only over a
   real photo: the gradient placeholder is already dark. */
.banner:not(.ph)::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to top,rgba(0,0,0,.42),transparent 55%)}

/* ---- countdown ---- */
.cd{margin-top:16px}
.cd-lab{display:flex;align-items:center;gap:7px;font-size:.78rem;font-weight:600;
  color:var(--ink-2);margin-bottom:9px}
.cd-lab svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;color:var(--brand-deep)}
.cd-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cd-cell{background:var(--surface-2);border:1px solid var(--line);border-radius:11px;
  padding:9px 4px;text-align:center}
.cd-cell b{display:block;font-size:1.08rem;font-weight:700;line-height:1.2;
  font-variant-numeric:tabular-nums}
.cd-cell i{display:block;font-style:normal;font-size:.64rem;font-weight:600;
  letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-top:2px}
/* Only the seconds pulse. Four pulsing cells reads as a broken screen. */
.cd-cell.sec b{animation:beat 1s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.15);opacity:.7}}
@media(prefers-reduced-motion:reduce){.cd-cell.sec b{animation:none}}

/* The started state, where the countdown was. */
.started{margin-top:16px;text-align:center;padding:10px 0}
.started b{display:block;font-size:1.05rem;font-weight:700;color:#0f9d58}
:root[data-theme="dark"] .started b{color:#4ade80}
@media(prefers-reduced-motion:no-preference){}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .started b{color:#4ade80}}
.started span{display:block;font-size:.83rem;color:var(--muted);margin-top:2px}

/* A real call to action, not a text link, when the row carries a URL. */
.act .cta{display:block;width:100%;padding:0 18px;height:44px;line-height:44px;
  border:0;font-family:inherit;cursor:pointer;
  border-radius:12px;text-align:center;font-weight:600;font-size:.92rem;color:#fff;
  background:linear-gradient(120deg,var(--brand),var(--brand-deep));
  box-shadow:0 8px 20px rgba(46,124,190,.30);text-decoration:none;
  transition:transform .2s,box-shadow .2s,filter .2s}
.act .cta:hover{transform:translateY(-2px) scale(1.02);filter:brightness(1.06);
  box-shadow:0 12px 26px rgba(46,124,190,.38)}
.act .cta:active{transform:scale(.98)}
.act .cta:focus-visible{outline:2px solid var(--brand-deep);outline-offset:3px}
.act{display:block}

/* ---- registration modal ----------------------------------------------
   A row with no action_url opens the form here instead of sending the
   visitor away. On a booth screen that matters: a new tab is a tab someone
   has to close before the next person can use the stand. */
.rmodal{position:fixed;inset:0;z-index:50;display:none;align-items:center;
  justify-content:center;padding:24px}
.rmodal.open{display:flex}
.rmodal-scrim{position:absolute;inset:0;background:rgba(11,26,38,.55);
  backdrop-filter:blur(3px)}
.rmodal-box{position:relative;width:100%;max-width:720px;height:min(88vh,880px);
  background:var(--surface);border-radius:18px;box-shadow:var(--shadow-lg,0 26px 60px rgba(23,50,79,.3));
  display:flex;flex-direction:column;overflow:hidden}
/* An embedded Google Form has no height we can read across origins, so that
   mode keeps the tall fixed box. Our own form is three fields and a button:
   sizing it to its content stops the panel opening as a mostly empty column
   with the button stranded at the bottom of the screen. */
.rmodal.own .rmodal-box{height:auto;max-height:88vh}
.rmodal.own .msf{height:auto}
.rmodal.own .msf-foot{margin-top:0}
.rmodal-head{display:flex;align-items:flex-start;gap:14px;padding:16px 18px;
  border-bottom:1px solid var(--line)}
.rmodal-head h3{margin:0;font-family:'Fraunces',Georgia,serif;font-size:1.02rem;
  font-weight:600;line-height:1.35;min-width:0;overflow-wrap:anywhere}
.rmodal-head p{margin:3px 0 0;font-size:.8rem;color:var(--muted)}
.rmodal-x{flex:0 0 auto;margin-left:auto;width:36px;height:36px;border-radius:50%;
  border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
  font-size:1.05rem;line-height:1;cursor:pointer;transition:.2s}
.rmodal-x:hover{background:var(--surface-2);color:var(--ink)}
.rmodal-x:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.rmodal-body{flex:1 1 auto;min-height:0;position:relative;background:var(--surface-2)}
.rmodal-body iframe{width:100%;height:100%;border:0;display:block}
/* Shown behind the iframe, so a form that is slow or blocked does not leave
   a blank white panel with no explanation. */
.rmodal-wait{position:absolute;inset:0;display:grid;place-items:center;
  padding:26px;text-align:center;font-size:.86rem;color:var(--ink-2);line-height:1.6}
.rmodal-wait a{color:var(--brand-deep);font-weight:600}
.rmodal-body iframe{position:relative;z-index:1;background:transparent}
/* A class selector beats the user agent's [hidden]{display:none}, so every
   element here that sets its own display must turn itself off explicitly.
   Without this the "Opening the form" overlay stayed on top of the form it
   was supposed to be replaced by -- and an assertion on el.hidden still
   passed, because the attribute was set. The attribute was never the
   question. */
.rmodal-wait[hidden],.rmodal-body iframe[hidden],.msf[hidden]{display:none}
@media(max-width:560px){
  .rmodal{padding:0}
  .rmodal-box{max-width:none;height:100%;border-radius:0}
  /* Our own form sits as a sheet against the bottom, where a thumb is,
     rather than a full-screen page with one field at the top. */
  .rmodal.own{align-items:flex-end}
  .rmodal.own .rmodal-box{height:auto;max-height:92vh;
    border-radius:18px 18px 0 0}
}
body.rmodal-on{overflow:hidden}

/* ---- the multi-step form ---------------------------------------------
   Three questions, one at a time. A booth visitor with a phone in one hand
   answers three short things faster than they read one long form. */
.msf{padding:24px 22px 22px;display:flex;flex-direction:column;height:100%;
  overflow-y:auto;-webkit-overflow-scrolling:touch}
.msf-dots{display:flex;align-items:center;justify-content:center;gap:11px;margin-bottom:26px}
.msf-dot{display:flex;align-items:center;justify-content:center;width:34px;height:34px;
  border-radius:50%;border:0;font:inherit;font-size:.86rem;font-weight:600;
  font-variant-numeric:tabular-nums;background:var(--surface-2);color:var(--muted);
  transition:.45s cubic-bezier(.22,1,.36,1)}
.msf-dot.done{background:var(--brand-soft);color:var(--brand-deep);cursor:pointer}
.msf-dot.now{background:var(--brand-deep);color:#fff;
  box-shadow:0 0 0 5px color-mix(in srgb,var(--brand) 20%,transparent)}
.msf-dot:disabled{cursor:not-allowed}
/* The tick inside a completed step had no rule of its own, so it rendered as
   a solid black fill instead of a stroked mark in the step's own colour. */
.msf-dot svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:3;
  stroke-linecap:round;stroke-linejoin:round}
.msf-link{position:relative;height:2px;width:42px;background:var(--line);overflow:hidden}
.msf-link i{position:absolute;inset:0;background:var(--brand);transform-origin:left;
  transform:scaleX(0);transition:transform .55s cubic-bezier(.22,1,.36,1)}
.msf-link.on i{transform:scaleX(1)}

.msf-bar{height:2px;border-radius:2px;background:var(--surface-2);overflow:hidden;margin-bottom:26px}
.msf-bar i{display:block;height:100%;width:0;
  background:linear-gradient(90deg,var(--brand),var(--brand-deep));
  transition:width .7s cubic-bezier(.22,1,.36,1)}

.msf-step{animation:msfIn .5s cubic-bezier(.22,1,.36,1) both}
@keyframes msfIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){
  .msf-step{animation:none}
  .msf-link i,.msf-bar i,.msf-dot{transition:none}
}
.msf-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.msf-head label{font-size:1.05rem;font-weight:600;letter-spacing:-.01em}
.msf-head span{font-size:.74rem;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.msf input{width:100%;height:52px;padding:0 15px;border-radius:11px;font:inherit;font-size:1rem;
  color:var(--ink);background:var(--surface);border:1px solid var(--line);
  transition:border-color .3s,box-shadow .3s}
.msf input:focus{outline:none;border-color:var(--brand);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 22%,transparent)}
.msf input[aria-invalid="true"]{border-color:#d03b3b}
.msf-err{margin:8px 0 0;font-size:.82rem;color:#d03b3b;min-height:1.1em}

.msf-consent{margin:16px 0 0;display:flex;gap:10px;align-items:flex-start;
  font-size:.8rem;line-height:1.55;color:var(--ink-2)}
.msf-consent input{width:17px;height:17px;flex:0 0 auto;margin-top:2px;height:17px}
.msf-consent a{color:var(--brand-deep)}

.msf-foot{margin-top:auto;padding-top:20px}
.msf-go{width:100%;height:48px;border:0;border-radius:12px;font:inherit;font-size:.95rem;
  font-weight:600;color:#fff;cursor:pointer;display:inline-flex;align-items:center;
  justify-content:center;gap:8px;
  background:linear-gradient(120deg,var(--brand),var(--brand-deep));
  box-shadow:0 8px 20px rgba(46,124,190,.28);transition:.25s}
.msf-go:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.06)}
.msf-go:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none}
.msf-back{display:block;width:100%;margin-top:12px;padding:8px;border:0;background:none;
  font:inherit;font-size:.85rem;color:var(--muted);cursor:pointer;transition:.2s}
.msf-back:hover{color:var(--ink)}

/* done */
.msf-done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;gap:14px;padding:26px 0 18px;
  animation:msfIn .6s cubic-bezier(.22,1,.36,1) both}
.msf-tick{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;
  background:color-mix(in srgb,#0f9d58 14%,transparent);border:2px solid color-mix(in srgb,#0f9d58 35%,transparent)}
.msf-tick svg{width:30px;height:30px;stroke:#0f9d58;fill:none;stroke-width:3;
  stroke-linecap:round;stroke-linejoin:round}
.msf-done h4{margin:0;font-family:'Fraunces',Georgia,serif;font-size:1.25rem;font-weight:600}
.msf-done p{margin:0;font-size:.88rem;color:var(--ink-2);max-width:34ch;line-height:1.6}
.msf-code{margin-top:4px;padding:14px 20px;border-radius:12px;background:var(--surface-2)}
.msf-code b{display:block;font-size:1.32rem;font-weight:700;letter-spacing:.07em;
  font-variant-numeric:tabular-nums}
.msf-code span{display:block;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);margin-bottom:3px}

.meta{display:flex;flex-direction:column;gap:9px;font-size:.88rem;color:var(--ink-2);
  line-height:1.5}
.meta .row{display:flex;align-items:flex-start;gap:9px}
.meta svg{flex:0 0 auto;width:16px;height:16px;margin-top:2px;stroke:currentColor;
  fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;color:var(--brand-deep)}
.meta .row span{min-width:0;overflow-wrap:anywhere}

/* ---- CSV parsing: quotes, embedded commas, embedded newlines, "" escapes.
   Locations here contain commas, so a naive split would shear them. ---- */
function parseCSV(text){
  var rows=[], row=[], cur="", q=false, i=0;
  text = text.replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  for(; i<text.length; i++){
    var c=text[i];
    if(q){
      if(c === '"'){ if(text[i+1] === '"'){ cur+='"'; i++; } else q=false; }
      else cur+=c;
    } else {
      if(c === '"') q=true;
      else if(c === ','){ row.push(cur); cur=""; }
      else if(c === '\n'){ row.push(cur); rows.push(row); row=[]; cur=""; }
      else cur+=c;
    }
  }
  if(cur.length || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(function(r){ return r.some(function(c){ return String(c).trim()!==""; }); });
}

/* Columns are matched by header NAME, so the sheet can be reordered freely. */
function toObjects(rows){
  if(!rows.length) return [];
  var head = rows[0].map(function(h){ return String(h).trim().toLowerCase().replace(/\s+/g,"_"); });
  return rows.slice(1).map(function(r){
    var o={};
    head.forEach(function(h,i){ o[h] = (r[i]==null?"":String(r[i]).trim()); });
    return o;
  });
}

/* gviz JSONP. Google's gviz endpoint sends no CORS header, so a <script> tag
   is the transport that works from any origin — the same approach the test
   reports page already uses. */
var seq=0;
function fetchJsonp(id,gid,ms){
  return new Promise(function(resolve,reject){
    var cb="__ev_cb_"+(++seq), s=document.createElement("script"), done=false;
    function cleanup(){ clearTimeout(t); try{ delete window[cb]; }catch(e){ window[cb]=undefined; }
                        if(s.parentNode) s.parentNode.removeChild(s); }
    var t=setTimeout(function(){ if(!done){ done=true; cleanup(); reject(new Error("timeout")); } }, ms||15000);
    window[cb]=function(p){
      if(done) return; done=true; cleanup();
      try{
        if(!p||!p.table) throw new Error("malformed");
        /* gviz hands a date cell back as the STRING "Date(2026,8,10)" --
           month zero-based -- with the sheet's display text in .f. Passing
           .v straight through put that literal in start_date, every row
           failed the date test, and the whole board fell into "Dates not
           fixed yet" with no countdowns. It only showed up once the sheet
           went public, because until then this path never returned at all.
           The typed value is the exact one, so it is converted rather than
           falling back to .f, whose format follows the viewer's locale. */
        var cell=function(c){
          if(c==null || c.v==null) return "";
          if(typeof c.v==="string"){
            var d=/^Date\((\d{4}),(\d{1,2}),(\d{1,2})/.exec(c.v);
            if(d){
              var pad=function(n){ return (n<10?"0":"")+n; };
              return d[1]+"-"+pad(+d[2]+1)+"-"+pad(+d[3]);
            }
            return c.v;
          }
          return c.f!=null ? String(c.f) : String(c.v);
        };
        /* gviz eats the header row into cols[].label — put it back as row 0
           so the shape matches parseCSV() exactly. */
        var out=[ (p.table.cols||[]).map(function(c){ return (c.label||"").trim(); }) ];
        (p.table.rows||[]).forEach(function(r){ out.push((r.c||[]).map(cell)); });
        resolve(out);
      }catch(e){ reject(e); }
    };
    s.onerror=function(){ if(!done){ done=true; cleanup(); reject(new Error("blocked")); } };
    s.src="https://docs.google.com/spreadsheets/d/"+id+"/gviz/tq?tqx=out:json;responseHandler:"
          +cb+"&gid="+gid+"&cacheBust="+Date.now();
    document.head.appendChild(s);
  });
}

function fetchCsv(id,gid){
  var url="https://docs.google.com/spreadsheets/d/"+id+"/export?format=csv&gid="+gid+"&cacheBust="+Date.now();
  return fetch(url,{cache:"no-store"}).then(function(r){
    if(!r.ok) throw new Error("HTTP "+r.status);
    return r.text();
  }).then(parseCSV);
}

/* ---- dates ---- */
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var DOW=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
/* Parsed as local midnight on purpose: new Date("2026-09-10") is UTC, which
   in Malaysia (UTC+8) is still the 10th, but the same code in a negative
   offset would render the 9th. Splitting the parts avoids that entirely. */
function parseDate(s){
  s = String(s||"").trim();
  if(!s) return null;
  var mk=function(y,mo,da){
    var d=new Date(y, mo-1, da);
    return (isNaN(d.getTime()) || d.getMonth()!==mo-1) ? null : d;
  };

  var m=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(s);
  if(m) return mk(+m[1], +m[2], +m[3]);

  /* Belt and braces for the gviz literal, in case it reaches here by some
     other path than the cell reader. Month is zero-based in that form. */
  var g=/^Date\((\d{4}),(\d{1,2}),(\d{1,2})/.exec(s);
  if(g) return mk(+g[1], +g[2]+1, +g[3]);

  /* A sheet whose date column is formatted rather than plain text exports as
     something slash-separated, and 3/4/2026 means March in one locale and
     April in another. Where one part is over 12 the order is certain and it
     is read; where both could be a month it is refused, because a card
     showing the wrong month is worse than one saying the date is not fixed. */
  var q=/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})$/.exec(s);
  if(q){
    var a=+q[1], b=+q[2], y=+q[3];
    if(a>12 && b<=12) return mk(y, b, a);   /* D/M/YYYY */
    if(b>12 && a<=12) return mk(y, a, b);   /* M/D/YYYY */
    return null;
  }
  return null;
}
function midnight(d){ return new Date(d.getFullYear(),d.getMonth(),d.getDate()); }

/* The countdown needs a moment, not a day. The `time` column is display text
   ("8.00 am - 5.30 pm") and parsing it would guess; an optional start_time
   column in 24h HH:MM is read instead. With no start_time the count runs to
   midnight at the start of the day, which is the honest reading of a row that
   only gives a date. */
function startMoment(d, hhmm, timeText){
  var t=new Date(d.getFullYear(), d.getMonth(), d.getDate());
  var m=/^(\d{1,2}):(\d{2})$/.exec(String(hhmm||"").trim());
  if(m){ t.setHours(Math.min(23,+m[1]), Math.min(59,+m[2]), 0, 0); return t; }

  /* Falling back to midnight left every card counting to the same instant, so
     three events months apart all read 08:48:00 and differed only in the day
     count -- correct, and it looks broken. The display column opens with a
     time in every row we have ("8.00 am - 5.30 pm"), so read that when the
     shape is unambiguous. Anything that does not match this exactly is left
     at midnight rather than guessed at. */
  var g=/^\s*(\d{1,2})[.:](\d{2})\s*(am|pm)\b/i.exec(String(timeText||""));
  if(g){
    var h=+g[1] % 12;
    if(/pm/i.test(g[3])) h+=12;
    t.setHours(h, Math.min(59,+g[2]), 0, 0);
  }
  return t;
}

function statusOf(a,b,today){
  if(!a) return {key:"tbc", label:"", cls:""};
  var end = b || a;
  if(today < a) {
    var days = Math.round((a-today)/86400000);
    if(days<=14) return {key:"upcoming", label:(days===0?"Today":days===1?"Tomorrow":"In "+days+" days"), cls:"soon"};
    return {key:"upcoming", label:"Upcoming", cls:""};
  }
  if(today > end) return {key:"past", label:"Past", cls:""};
  return {key:"live", label:"Happening now", cls:"live"};
}

/* A URL out of the sheet goes into href/src, so only http(s) is allowed
   through. The sheet is owner-edited, but this page is public and a
   javascript: or data: value pasted into a cell should never become a live
   link on a booth screen. Anything else is dropped, not rendered broken. */
function safeUrl(u){
  u=String(u==null?"":u).trim();
  if(!u) return "";
  try{
    var p=new URL(u, location.href);
    return (p.protocol==="http:"||p.protocol==="https:") ? p.href : "";
  }catch(e){ return ""; }
}

/* A Google Drive "share" link is a viewer PAGE, not an image. Pasting one
   into image_url hands <img> an HTML document, the load fails, and the card
   falls back to the brand gradient -- which is exactly what happened to the
   PDM AGM and Guardian rows, and it looks like the page ignoring the cell
   rather than the link being the wrong kind. The file id is right there in
   the link and Drive serves the file itself from /thumbnail, so read the id
   out and ask for that instead. The file still has to be shared "Anyone with
   the link"; a private file returns a sign-in page and the gradient is back.
   Anything that is not a Drive link passes through untouched. */
function driveImage(u){
  var m = u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:[^#]*&)?id=|thumbnail\?(?:[^#]*&)?id=)([\w-]{20,})/)
       || u.match(/drive\.google\.com\/[^\s]*[?&]id=([\w-]{20,})/);
  return m ? "https://drive.google.com/thumbnail?id="+m[1]+"&sz=w1600" : u;
}
/* Rewrite first, then validate: a javascript: value never matches the Drive
   pattern, so it reaches safeUrl unchanged and is dropped there. */
function imageUrl(u){ return safeUrl(driveImage(String(u==null?"":u).trim())); }

function esc(s){ return String(s==null?"":s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }

var PIN='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>';
var CLK='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>';
var CAL='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>';
var PPL='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/></svg>';

/* The date used to sit top-right of the card, opposite the title, as a big
   stacked block. It reads better as the first fact under the venue: a card is
   scanned "what / where / when", and the head is left with one job. Same
   information, one line, in the same icon list as the venue and the hours --
   the big numerals were competing with the event name for the top of the
   card. */
function dateLine(a,b){
  if(!a) return 'Date not fixed';
  var one = DOW[a.getDay()]+', '+a.getDate()+' '+MON[a.getMonth()];
  if(!b || a.getTime()===b.getTime()) return one;
  /* Same month or not, the end still carries its month: "10 - 13 Sep" saves
     three characters and costs the reader a guess on a range that crosses
     one. */
  return one+' \u2013 '+b.getDate()+' '+MON[b.getMonth()];
}

function card(e, today, i){
  var a=parseDate(e.start_date), b=parseDate(e.end_date);
  if(a && b && b < a) b = a;              /* a typo in the sheet must not invert a range */
  var st=statusOf(a,b,today);
  var img = imageUrl(e.image_url), link = safeUrl(e.action_url);
  /* Two <img> with the same src, not two downloads: the browser serves the
     second from cache. The first is the blurred fill behind the fit, the
     second is the artwork itself. */
  var art = img
    ? '<img class="bg" src="'+esc(img)+'" alt="" aria-hidden="true" loading="lazy">'
      + '<img class="fg" src="'+esc(img)+'" alt="'+esc(e.event)+'" loading="lazy" data-brand="'
      + esc(e.brand || "Facerinna")+'">'
    : '<span class="mark">'+esc(e.brand || "Facerinna")+'</span>';
  var tag = st.label ? '<span class="tag '+st.cls+'">'+esc(st.label)+'</span>' : '';

  /* Countdown, for an event that has not started. The target rides on the
     card as a timestamp so one interval can drive every card on the page
     rather than each card owning a timer. */
  var cd='', target=0;
  if(a && st.key==="upcoming"){
    target = +startMoment(a, e.start_time, e.time);
    cd = '<div class="cd" data-target="'+target+'">'
       + '<div class="cd-lab">'+CLK+'<span>Event starts in</span></div>'
       + '<div class="cd-grid">'
       +   '<div class="cd-cell"><b data-u="d">--</b><i>Days</i></div>'
       +   '<div class="cd-cell"><b data-u="h">--</b><i>Hrs</i></div>'
       +   '<div class="cd-cell"><b data-u="m">--</b><i>Min</i></div>'
       +   '<div class="cd-cell sec"><b data-u="s">--</b><i>Sec</i></div>'
       + '</div></div>';
  }
  /* An event already running says so where the countdown would be, rather
     than leaving a gap the eye reads as a missing element. */
  if(st.key==="live"){
    cd = '<div class="started"><b>Event started</b><span>Come and find us</span></div>';
  }

  /* Under a day out, and the card says so where the eye lands first. */
  var urgent = (target && target - Date.now() > 0 && target - Date.now() < 86400000)
    ? '<span class="urgent">Starts soon</span>' : '';

  var meta='';
  if(e.location) meta += '<div class="row">'+PIN+'<span>'+esc(e.location)+'</span></div>';
  meta += '<div class="row when">'+CAL+'<span>'+esc(dateLine(a,b))+'</span></div>';
  if(e.time)     meta += '<div class="row">'+CLK+'<span>'+esc(e.time)+'</span></div>';
  /* Only shown when the sheet carries the column. An attendee count is not
     something to invent for a card that a clinic partner will read. */
  if(e.attendees) meta += '<div class="row">'+PPL+'<span>'+esc(e.attendees)+' attending</span></div>';

  /* The date block already says the date is not settled. A details cell that
     repeats it leaves the card saying the same thing twice, in two places, in
     two different wordings. Drop the repeat and keep whatever else the cell
     carries. */
  var details = String(e.details || "").trim();
  if(!a){
    details = details.replace(/(^|\s)dates?\s+(to\s+be\s+confirmed|not\s+(yet\s+)?(fixed|confirmed))\s*\.?/i, " ").trim();
  }

  var spot='';
  if(e.highlight){
    spot = '<div class="spot"><b>'+esc(e.highlight)+'</b>'
         + (e.highlight_time ? '<span>'+esc(e.highlight_time)+'</span>' : '')
         + '</div>';
  }

  /* The sheet's own label wins: "Reserve Your Spot" is wrong for a mall
     pop-up nobody books. It is only the fallback when the row leaves it
     blank, and it changes once the event is running. A row with no URL keeps
     the plain text line -- a button that goes nowhere is worse on a booth
     screen than no button at all. */
  var act;
  if(link){
    /* An explicit action_url still wins: some events are somebody else's
       registration, and a race entry does not belong in our form. */
    act = '<a class="cta" href="'+esc(link)+'" target="_blank" rel="noopener">'
        + esc(e.action_label || "Find out more")+'</a>';
  } else {
    /* This button opens OUR registration form, so it has to say so.
       action_label was written for a link -- "Visit the booth" on a button
       that opens a form is a small lie, and the visitor finds out only after
       clicking. form_label is the cell to set for per-event wording. */
    var form = safeUrl(e.form_url) || DEFAULT_FORM;
    var label = e.form_label || (st.key==="live" ? "Join us" : "Register here");
    act = '<button class="cta" type="button" data-form="'+esc(form)+'" data-event="'
        + esc(e.event)+'">'+esc(label)+'</button>';
  }

  return '<article class="card'+(st.key==="past"?" past":"")+'" style="animation-delay:'+(i*60)+'ms">'
    + '<div class="card-head">'
    +   '<div class="lede"><h4>'+esc(e.event)+'</h4>'
    +     (e.brand ? '<p class="brandline">'+esc(e.brand)+'</p>' : '')
    +   '</div>'
    + '</div>'
    + '<div class="banner'+(img?'':' ph')+'">'+art+tag+urgent+'</div>'
    + (meta ? '<div class="meta">'+meta+'</div>' : '')
    + cd
    + spot
    + (details ? '<p class="details">'+esc(details)+'</p>' : '')
    + (act ? '<div class="act">'+act+'</div>' : '')
    + '</article>';
}

function render(list){
  var today=midnight(new Date());
  var rows=list.filter(function(e){
    return e.event && String(e.show||"TRUE").toUpperCase()!=="FALSE";
  });

  var groups=[
    {key:"now",  title:"Happening now", items:[]},
    {key:"next", title:"Coming up",     items:[]},
    {key:"tbc",  title:"Dates not fixed yet", items:[]},
    {key:"past", title:"Finished", items:[]}
  ];
  rows.forEach(function(e){
    var a=parseDate(e.start_date), b=parseDate(e.end_date);
    var st=statusOf(a,b,today);
    var g = st.key==="live" ? "now" : st.key==="upcoming" ? "next" : st.key==="past" ? "past" : "tbc";
    groups.filter(function(x){ return x.key===g; })[0].items.push(e);
  });
  /* soonest first among the upcoming, most recent first among the past */
  var by=function(dir){ return function(x,y){
    var dx=parseDate(x.start_date), dy=parseDate(y.start_date);
    if(!dx||!dy) return 0;
    return dir*(dx-dy);
  };};
  groups[0].items.sort(by(1)); groups[1].items.sort(by(1)); groups[3].items.sort(by(-1));

  var html="", n=0;
  groups.forEach(function(g){
    if(!g.items.length) return;
    html += '<div class="group"><h3>'+esc(g.title)+'</h3><span class="rule"></span></div>'
          + '<div class="grid">'
          + g.items.map(function(e){ return card(e,today,n++); }).join("")
          + '</div>';
  });
  if(!html) html = '<div class="note">Nothing listed yet.</div>';
  document.getElementById("out").innerHTML = html;
  tickCountdowns();          /* fill the cells before the first tick lands */
  wireImageFallback();
}

/* A URL pasted into the sheet can stop serving, or never have served an
   image at all -- a Google Drive "share" link returns a viewer page, not a
   file. Without this the card shows the browser's broken-image glyph, which
   looks like the page is broken rather than the link. On failure the banner
   falls back to the same gradient a row with no image gets. */
/* A thumbnail 16/9 wide with nothing but a 4:5 poster to put in it wastes
   most of itself. The box takes the artwork's proportions instead, clamped so
   neither extreme runs away with the card. */
var AR_MIN = 18/25, AR_MAX = 16/9;
function fitBanner(img){
  if(!img.naturalWidth || !img.naturalHeight) return;
  var ar = img.naturalWidth / img.naturalHeight;
  var bn = img.parentNode;
  if(bn && !bn.classList.contains("ph"))
    bn.style.setProperty("--ar", Math.min(AR_MAX, Math.max(AR_MIN, ar)));
}

function wireImageFallback(){
  /* The foreground only. The blurred fill carries the same src, so if one
     fails the other has too, and wiring both would run the swap twice. */
  document.querySelectorAll(".banner img.fg").forEach(function(img){
    var swap = function(){
      var bn = img.parentNode;
      if(!bn || bn.classList.contains("ph")) return;
      var name = img.getAttribute("data-brand") || "Facerinna";
      bn.classList.add("ph");
      bn.style.removeProperty("--ar");
      bn.querySelectorAll("img").forEach(function(x){ x.remove(); });
      var mark = document.createElement("span");
      mark.className = "mark";
      mark.textContent = name;
      bn.insertBefore(mark, bn.firstChild);
    };
    img.addEventListener("error", swap);
    img.addEventListener("load", function(){ fitBanner(img); });
    /* An image that failed before this ran reports complete with no width. */
    if(img.complete && img.naturalWidth === 0) swap();
    /* And one that succeeded before this ran never fires load. */
    else if(img.complete) fitBanner(img);
  });
}

function setFeed(cls, txt){
  var f=document.getElementById("feed");
  f.className="feed "+cls;
  document.getElementById("feedTxt").textContent=txt;
}

function stamp(src){
  var t=new Date();
  var pad=function(v){ return v<10?"0"+v:""+v; };
  document.getElementById("stamp").textContent =
    "Checked "+pad(t.getHours())+":"+pad(t.getMinutes())+
    ", "+t.getDate()+" "+MON[t.getMonth()]+" "+t.getFullYear()+
    (src==="fallback" ? ". We could not reach the schedule, so these are the dates saved in the page." : ".");
}

function load(){
  setFeed("", "Loading…");
  /* Paint the saved rows straight away on the first load. Waiting for the
     network meant up to fifteen seconds of grey skeletons on a booth screen
     -- no cards, and so no countdown, which is exactly what a visitor would
     report as "the countdown is missing". Live data replaces this the moment
     it lands, and the badge says which one is on screen. */
  if(!primed){ primed = true; render(FALLBACK); }
  /* CSV first (one request, no script tag); JSONP is the fallback for the
     CORS block, which is the common case from a plain browser. */
  fetchCsv(SHEET_ID, GID)
    .catch(function(){ return fetchJsonp(SHEET_ID, GID, 8000); })
    .then(function(rows){
      var objs=toObjects(rows);
      if(!objs.length) throw new Error("empty");
      render(objs);
      setFeed("live","Live");
      stamp("sheet");
    })
    .catch(function(err){
      render(FALLBACK);
      setFeed("stale","Offline copy");
      stamp("fallback");
      var out=document.getElementById("out");
      var n=document.createElement("div");
      n.className="note";
      n.innerHTML='<b>These are saved dates.</b> We could not reach the live schedule '
        + '('+esc(err && err.message ? err.message : "no reason given")+'). '
        + 'Share the sheet as <b>Anyone with the link, Viewer</b> and this page will read it.';
      out.appendChild(n);
    });
}

/* One timer for the whole page. Cards are re-rendered on every load, so this
   reads the DOM each tick rather than holding references that go stale. */
var lastAuto = 0, primed = false;
function tickCountdowns(){
  var now=Date.now(), stale=false;
  var els=document.querySelectorAll(".cd");
  for(var i=0;i<els.length;i++){
    var el=els[i], left=Math.max(0, Math.floor((+el.dataset.target - now)/1000));
    if(left===0){ stale=true; }
    var d=Math.floor(left/86400), h=Math.floor((left%86400)/3600),
        m=Math.floor((left%3600)/60), sec=left%60;
    var put=function(u,v){ var b=el.querySelector('[data-u="'+u+'"]');
      var t=(v<10?"0":"")+v; if(b && b.textContent!==t) b.textContent=t; };
    put("d",d); put("h",h); put("m",m); put("s",sec);
  }
  /* A countdown that hits zero means the card belongs in another group now,
     so re-read rather than leave a "Starts in 00:00:00:00" on the screen.
     Rate-limited: if that re-read fails and the card comes back still at
     zero, an unguarded call here would hit the network every second. */
  if(stale && Date.now() - lastAuto > 30000){ lastAuto = Date.now(); load(); }
}
setInterval(tickCountdowns, 1000);

/* ---- spotlight -------------------------------------------------------
   One listener for the page, throttled to a frame. Each card is handed the
   pointer in its own coordinates, so the effect survives the filter the
   entry animation leaves behind and any transform on the card.

   The hue rides the pointer across the viewport the way the reference does,
   but over a 55 degree arc inside the Facerinna blues rather than the 200
   the original sweeps. A full sweep passes through yellow and green, which
   on a page carrying the brand's own logo reads as a fault, not a flourish. */
var HUE_BASE = 185, HUE_SPREAD = 55;
(function(){
  var px = 0, py = 0, queued = false, lit = false;

  function paint(){
    queued = false;
    var root = document.documentElement;
    if(!lit){ lit = true; root.classList.add("lamp"); }
    root.style.setProperty("--hue",
      (HUE_BASE + (px / Math.max(1, innerWidth)) * HUE_SPREAD).toFixed(1));
    var cards = document.querySelectorAll(".card");
    for(var i = 0; i < cards.length; i++){
      var c = cards[i], r = c.getBoundingClientRect();
      /* Skip a card that is nowhere near the screen: its glow cannot be seen
         and reading its box still costs layout. */
      if(r.bottom < -200 || r.top > innerHeight + 200) continue;
      c.style.setProperty("--gx", (px - r.left).toFixed(0) + "px");
      c.style.setProperty("--gy", (py - r.top).toFixed(0) + "px");
    }
  }

  addEventListener("pointermove", function(e){
    /* A finger reports pointerType "touch" and gives no hover, so the lamp
       stays off rather than snapping to wherever the last tap landed. */
    if(e.pointerType === "touch") return;
    px = e.clientX; py = e.clientY;
    if(!queued){ queued = true; requestAnimationFrame(paint); }
  }, {passive:true});

  /* Scrolling moves the cards under a stationary pointer, so the light has
     to be re-solved even though the pointer never moved. */
  addEventListener("scroll", function(){
    if(lit && !queued){ queued = true; requestAnimationFrame(paint); }
  }, {passive:true});
})();

/* ---- registration modal ---------------------------------------------
   Google Forms embeds through an iframe with ?embedded=true. Nothing is
   posted by this page: the form is Google's, so the submission, the
   validation and the response row are all theirs. This page only frames it.
   No name, phone or email passes through here or is stored here. */
(function(){
  var box=document.getElementById("rmodal"), frame=document.getElementById("rmFrame"),
      wait=document.getElementById("rmWait"), title=document.getElementById("rmTitle"),
      sub=document.getElementById("rmSub"), x=document.getElementById("rmX"),
      mount=document.getElementById("msf");
  var lastFocus=null, waitT=null;

  /* ---- the three questions ---------------------------------------- */
  var STEPS=[
    {key:"name",  label:"Name",  type:"text",  hint:"Your full name",
     check:function(v){ return v.trim().length>=2 ? "" : "Please enter your name."; }},
    {key:"email", label:"Email", type:"email", hint:"you@example.com",
     check:function(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim())
        ? "" : "That does not look like an email address."; }},
    {key:"phone", label:"Phone", type:"tel",   hint:"01X-XXX XXXX",
     /* Malaysian mobiles are 9 or 10 digits after the leading zero, and people
        type them with spaces, dashes and +60. Count digits, not characters. */
     check:function(v){ var d=v.replace(/\D/g,"");
        return d.length>=9 && d.length<=15 ? "" : "Please enter a valid phone number."; }}
  ];

  var state=null;

  function svgTick(){ return '<svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>'; }

  function render(){
    if(!state) return;
    if(state.done){ renderDone(); return; }

    var i=state.step, st=STEPS[i];
    var dots="";
    for(var k=0;k<STEPS.length;k++){
      var cls = k<i ? "done" : (k===i ? "now" : "");
      dots += '<button type="button" class="msf-dot '+cls+'" data-goto="'+k+'"'
            + (k<i ? "" : " disabled")
            + ' aria-label="Step '+(k+1)+'">'
            + (k<i ? svgTick() : (k+1)) + '</button>';
      if(k<STEPS.length-1) dots += '<span class="msf-link'+(k<i?" on":"")+'"><i></i></span>';
    }

    var last = (i===STEPS.length-1);
    var consent = last
      ? '<label class="msf-consent"><input type="checkbox" id="msfOk"'
        + (state.consent ? " checked" : "") + '>'
        + '<span>I agree that Facerinna may use my name, email and phone number to '
        + 'issue my ticket and contact me about this event.'
        + (PRIVACY_URL ? ' <a href="'+esc(PRIVACY_URL)+'" target="_blank" rel="noopener">Privacy notice</a>.' : '')
        + '</span></label>'
      : "";

    mount.innerHTML =
      '<div class="msf-dots">'+dots+'</div>'
    + '<div class="msf-bar"><i style="width:'+(((i+1)/STEPS.length)*100)+'%"></i></div>'
    + '<div class="msf-step">'
    +   '<div class="msf-head"><label for="msfIn">'+esc(st.label)+'</label>'
    +     '<span>'+(i+1)+'/'+STEPS.length+'</span></div>'
    +   '<input id="msfIn" type="'+st.type+'" placeholder="'+esc(st.hint)+'" '
    +     'value="'+esc(state.data[st.key]||"")+'" autocomplete="'
    +     (st.key==="name"?"name":st.key==="email"?"email":"tel")+'">'
    +   '<p class="msf-err" id="msfErr" role="alert">'+esc(state.error||"")+'</p>'
    +   consent
    + '</div>'
    + '<div class="msf-foot">'
    +   '<button type="button" class="msf-go" id="msfGo">'
    +     (state.busy ? "Sending…" : (last ? "Complete" : "Continue"))
    +   '</button>'
    +   (i>0 ? '<button type="button" class="msf-back" id="msfBack">Go back</button>' : '')
    + '</div>';

    var input=document.getElementById("msfIn");
    input.focus();
    syncGo();
    input.addEventListener("input", function(){
      state.data[st.key]=input.value;
      if(state.error){ state.error=""; document.getElementById("msfErr").textContent=""; }
      syncGo();
    });
    input.addEventListener("keydown", function(ev){
      if(ev.key==="Enter"){ ev.preventDefault(); advance(); }
    });
    var ok=document.getElementById("msfOk");
    if(ok) ok.addEventListener("change", function(){ state.consent=ok.checked; syncGo(); });
    document.getElementById("msfGo").addEventListener("click", advance);
    var back=document.getElementById("msfBack");
    if(back) back.addEventListener("click", function(){ state.step--; state.error=""; render(); });
    mount.querySelectorAll("[data-goto]").forEach(function(b){
      b.addEventListener("click", function(){
        var k=+b.dataset.goto;
        if(k<state.step){ state.step=k; state.error=""; render(); }
      });
    });
  }

  /* The button is disabled until the step can actually be completed, so
     nobody taps Continue and is told off for something they can see. */
  function syncGo(){
    var st=STEPS[state.step], go=document.getElementById("msfGo");
    if(!go) return;
    var filled=String(state.data[st.key]||"").trim().length>0;
    var last=state.step===STEPS.length-1;
    go.disabled = state.busy || !filled || (last && !state.consent);
  }

  function advance(){
    if(state.busy) return;
    var st=STEPS[state.step], v=String(state.data[st.key]||"");
    var err=st.check(v);
    if(err){ state.error=err;
      var e=document.getElementById("msfErr"); if(e) e.textContent=err;
      var inp=document.getElementById("msfIn"); if(inp) inp.setAttribute("aria-invalid","true");
      return; }
    state.error="";
    if(state.step < STEPS.length-1){ state.step++; render(); return; }
    if(!state.consent) return;
    submit();
  }

  function submit(){
    state.busy=true; render();
    var payload={ name:state.data.name.trim(), email:state.data.email.trim(),
                  phone:state.data.phone.trim(), event:state.event, consent:true };
    /* No custom headers on purpose. A POST with the default content type is a
       simple request, so the browser sends no preflight -- and an Apps Script
       web app cannot answer a preflight. */
    fetch(REGISTER_ENDPOINT, { method:"POST", body:JSON.stringify(payload) })
      .then(function(r){ return r.json(); })
      .then(function(res){
        if(!res || res.ok!==true) throw new Error((res && res.error) || "rejected");
        /* The script returns the existing code when this email is already
           registered for this event. Saying "you are registered" as though a
           new ticket had just been issued would send somebody hunting for an
           email that is not coming. */
        state.done=true; state.code=res.code||""; state.dup=res.duplicate===true;
        state.resent=res.resent===true;
        state.busy=false; render();
      })
      .catch(function(err){
        state.busy=false;
        state.error="We could not send that. Please try again, or register at the booth.";
        render();
        console.warn("registration failed:", err);
      });
  }

  function renderDone(){
    var first=state.data.name.trim().split(/\s+/)[0];
    /* Three different things happened, and saying the wrong one sends
       somebody to wait for an email that is not coming. */
    var line;
    if(state.dup && state.resent){
      line = esc(first)+', you already had a ticket for this one, so we have '
           + 'sent it to '+esc(state.data.email)+' again. Check your spam '
           + 'folder if it does not appear.';
    } else if(state.dup){
      line = esc(first)+', you are already registered for this one. Your code '
           + 'is below, and it is the same one we emailed to '
           + esc(state.data.email)+'. That is all you need at the door.';
    } else {
      line = esc(first)+', your ticket is on its way to '
           + esc(state.data.email)+'. Show it at the door.';
    }
    mount.innerHTML =
      '<div class="msf-done">'
    +   '<div class="msf-tick">'+svgTick()+'</div>'
    +   '<h4>'+(state.dup
          ? (state.resent ? "Sent again" : "Already registered")
          : "You are registered")+'</h4>'
    +   '<p>'+line+'</p>'
    +   (state.code ? '<div class="msf-code"><span>Ticket code</span><b>'
        + esc(state.code)+'</b></div>' : '')
    + '</div>';
  }

  /* ---- opening and closing ---------------------------------------- */
  function embedUrl(u){
    if(/[?&]embedded=true\b/.test(u)) return u;
    return u + (u.indexOf("?")>=0 ? "&" : "?") + "embedded=true";
  }

  function open(url, name){
    lastFocus=document.activeElement;
    title.textContent = name ? "Register: "+name : "Register";
    box.hidden=false; box.classList.add("open");
    document.body.classList.add("rmodal-on");

    if(REGISTER_ENDPOINT){
      /* Our own form, posting to our own script. */
      box.classList.add("own");
      sub.textContent = "Three quick questions. Your ticket arrives by email.";
      frame.hidden=true; wait.hidden=true; mount.hidden=false;
      state={ step:0, data:{}, error:"", busy:false, done:false, consent:false, event:name||"" };
      render();
    } else {
      /* Not deployed yet -- fall back to the Google Form rather than showing
         a form whose Complete button has nowhere to send anything. */
      box.classList.remove("own");
      sub.textContent = "The form is hosted by Google.";
      mount.hidden=true; frame.hidden=false; wait.hidden=false;
      wait.innerHTML="Opening the form&hellip;";
      wait.style.display="";
      frame.src=embedUrl(url);
      clearTimeout(waitT);
      waitT=setTimeout(function(){
        wait.innerHTML='Still loading. If nothing appears, '
          + '<a href="'+url.replace(/"/g,"&quot;")+'" target="_blank" rel="noopener">'
          + 'open the form in a new tab</a>.';
      },6000);
    }
    x.focus();
  }

  function close(){
    clearTimeout(waitT);
    box.classList.remove("open"); box.hidden=true;
    document.body.classList.remove("rmodal-on");
    frame.src="about:blank";
    mount.innerHTML="";
    state=null;
    if(lastFocus && lastFocus.focus) lastFocus.focus();
  }

  frame.addEventListener("load", function(){
    if(frame.src && frame.src!=="about:blank"){ clearTimeout(waitT); wait.style.display="none"; }
  });

  document.addEventListener("click", function(ev){
    var btn=ev.target.closest && ev.target.closest(".cta[data-form]");
    if(btn){ ev.preventDefault(); open(btn.dataset.form, btn.dataset.event); return; }
    if(ev.target.closest && ev.target.closest("[data-close]")) close();
  });
  x.addEventListener("click", close);
  addEventListener("keydown", function(ev){
    /* Escape mid-form would throw away three answers, so it only closes once
       the visitor is done or has not started. */
    if(ev.key!=="Escape" || !box.classList.contains("open")) return;
    if(state && !state.done && (state.data.name||state.data.email||state.data.phone)){
      if(!confirm("Close and lose what you have entered?")) return;
    }
    close();
  });
})();

document.getElementById("refresh").addEventListener("click", load);
load();
/* A booth screen is left running for days; re-read every 10 minutes so an
   edit to the sheet reaches it without anyone touching the machine. */
setInterval(load, 600000);
})();
</script>
</body>
</html>
