name: Verify site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  qr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Install zbar and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libzbar0
          python -m pip install --requirement tools/requirements.txt
      - name: Decode every QR with both decoders
        run: python tools/qr-test.py
