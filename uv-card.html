<title>Facerinna — UV Card</title>
<style>
  /* UV Card: four brochures, one hidden number.
     Everything that moves is a transform or an opacity, nothing else -- the
     chosen card, the three that leave, the UV lens and the number it shows
     are all composited layers, so a mid-range Android phone drags the lens
     at its screen rate with no layout work per frame. */
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#0B1620;color:#EAF4FF;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
  body{display:flex;flex-direction:column;height:100vh;
    background:
      radial-gradient(120% 70% at 50% -10%, rgba(94,60,220,.35), transparent 60%),
      radial-gradient(80% 50% at 50% 110%, rgba(30,120,200,.28), transparent 60%),
      #0B1620}
  @supports(height:100dvh){body{height:100dvh}}

  .hud{flex:none;display:grid;grid-template-columns:1fr auto 1fr;grid-template-areas:"back ttl sp" "hint hint hint";
    align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 14px 6px}
  .back,.cards{grid-area:back}.ttl{grid-area:ttl}.sp{grid-area:sp}.hint{grid-area:hint}
  .cards{justify-self:start;appearance:none;border:0;background:rgba(196,181,253,.14);color:#DDD1FF;
    font:inherit;font-weight:800;font-size:13px;letter-spacing:.06em;padding:7px 12px 7px 9px;border-radius:999px;
    cursor:pointer;box-shadow:inset 0 0 0 1px rgba(196,181,253,.45)}
  .cards[hidden]{display:none}
  /* a phone on its side has no height to spare: one row, hint in the middle */
  @media (orientation: landscape) and (max-height: 520px){
    .hud{grid-template-columns:auto 1fr auto;grid-template-areas:"back hint ttl";padding-bottom:2px}
    .sp{display:none}
  }
  .back{justify-self:start;color:#CFE3FF;text-decoration:none;font-weight:700;font-size:13px;
    letter-spacing:.06em;opacity:.8;padding:6px 8px 6px 0}
  .ttl{font-weight:900;font-size:13px;letter-spacing:.34em;text-transform:uppercase;
    color:#DDD1FF;text-shadow:0 0 18px rgba(170,120,255,.55)}
  .hint{text-align:center;font-size:14px;font-weight:700;color:#BFD8F5;
    min-height:20px;line-height:20px;transition:opacity .25s}
  .hint.dim{opacity:0}

  .stage{flex:1;position:relative;min-height:0;touch-action:none}

  /* ---- intro --------------------------------------------------------- */
  .intro{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;
    transition:opacity .35s,transform .35s}
  .intro.gone{opacity:0;transform:scale(.96);pointer-events:none}
  .intro h1{margin:0 0 10px;font-size:clamp(34px,9vw,54px);letter-spacing:.14em;font-weight:900;
    background:linear-gradient(90deg,#C4B5FD,#F2FF9A 55%,#7DF9FF);-webkit-background-clip:text;
    background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(160,120,255,.45))}
  .intro p{margin:0 auto 26px;max-width:340px;font-size:15px;line-height:1.5;color:#BFD8F5}
  .btn{appearance:none;border:0;border-radius:999px;padding:15px 34px;font:inherit;font-weight:900;text-decoration:none;
    font-size:16px;letter-spacing:.1em;text-transform:uppercase;color:#0B1620;cursor:pointer;
    background:linear-gradient(135deg,#F2FF9A,#7DF9FF);box-shadow:0 10px 30px rgba(125,249,255,.35);
    transition:transform .15s}
  .btn:active{transform:scale(.96)}
  .btn.ghost{background:transparent;color:#CFE3FF;box-shadow:inset 0 0 0 2px rgba(207,227,255,.5)}

  /* ---- the four cards ------------------------------------------------ */
  .deck{position:absolute;inset:0;display:grid;place-content:center;gap:var(--gap,14px);
    grid-template-columns:repeat(var(--cols,2),var(--cw,150px));padding:12px;
    visibility:hidden}
  .deck.on{visibility:visible}
  .card{position:relative;display:block;width:var(--cw,150px);aspect-ratio:585/1242;padding:0;
    border:0;border-radius:14px;overflow:hidden;background:#fff;cursor:pointer;
    box-shadow:0 14px 34px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.08);
    transform:translate3d(0,0,0);will-change:transform,opacity;
    transition:transform .52s cubic-bezier(.22,.9,.24,1),opacity .42s ease}
  .card img{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none}
  .card::after{content:"";position:absolute;inset:0;border-radius:inherit;
    background:linear-gradient(115deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.35) 48%,rgba(255,255,255,0) 60%);
    opacity:0;transition:opacity .3s}
  .card.pick::after{opacity:1}
  .card.dealing{transition:none}
  .card.away{opacity:0;pointer-events:none}
  .card.big{position:fixed;z-index:3;width:auto;aspect-ratio:auto;cursor:default;
    box-shadow:0 30px 70px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.1)}
  .card.big.lit{transition:none}
  /* a card whose number has been found: back in the row, dimmed, stamped */
  .card.done{cursor:default}
  .card.done img{filter:brightness(.55) saturate(.6)}
  /* z-index because the dimmed image's filter gives it a stacking context of
     its own, painted in tree order -- after the stamp, which sits before it
     in the markup -- and the number vanished under the brochure. */
  .stamp{position:absolute;inset:0;z-index:1;display:none;place-items:center;font-weight:900;line-height:1;
    color:#F2FF9A;text-shadow:0 0 10px #E9FF6A,0 0 28px rgba(201,255,63,.85);font-size:64px;font-size:clamp(40px,40cqw,120px)}
  .card{container-type:inline-size}
  .card.done .stamp{display:grid}

  /* ---- UV lens --------------------------------------------------------
     A translucent violet card. What it "shows" is a child layer the size of
     the big brochure, counter-translated so it stays pinned to the brochure
     while the lens moves over it: the number only exists inside the lens,
     which is what makes it read as UV ink. */
  .lens{position:fixed;left:0;top:0;z-index:5;width:180px;height:112px;border-radius:16px;
    background:linear-gradient(135deg,rgba(150,110,255,.30),rgba(90,50,200,.42));
    box-shadow:0 0 0 2px rgba(200,170,255,.75),0 0 28px rgba(150,100,255,.65),
      0 18px 40px rgba(0,0,0,.45),inset 0 0 22px rgba(190,150,255,.35);
    opacity:0;pointer-events:none;will-change:transform;transform:translate3d(-999px,-999px,0)}
  .lens.on{opacity:1;pointer-events:auto;transition:opacity .35s}
  .lens.snap{transition:opacity .35s,transform .16s ease-out}
  .lens.lock{box-shadow:0 0 0 3px rgba(242,255,154,.9),0 0 40px rgba(242,255,154,.7),
      0 18px 40px rgba(0,0,0,.45),inset 0 0 22px rgba(242,255,154,.35)}
  .lens.done{opacity:.35;pointer-events:none;transition:opacity .5s}
  .peek{position:absolute;inset:0;border-radius:inherit;overflow:hidden;
    background:rgba(60,20,150,.48)}
  .ink{position:absolute;left:0;top:0;width:300px;height:640px;will-change:transform}
  .ink .wm{position:absolute;left:0;right:0;text-align:center;font-weight:900;letter-spacing:.3em;
    color:rgba(196,181,253,.28);font-size:11px;text-transform:uppercase;white-space:nowrap}
  .ink .dot{position:absolute;width:6px;height:6px;border-radius:50%;background:rgba(190,255,220,.35);
    box-shadow:0 0 8px rgba(190,255,220,.6)}
  .num{position:absolute;transform:translate(-50%,-50%);font-weight:900;line-height:1;
    color:#F2FF9A;text-shadow:0 0 10px #E9FF6A,0 0 28px rgba(201,255,63,.85),0 0 60px rgba(125,249,255,.7);
    letter-spacing:-.02em;white-space:nowrap}
  .lens .tag{position:absolute;right:10px;bottom:7px;font-size:10px;font-weight:900;letter-spacing:.32em;
    color:rgba(230,220,255,.85)}
  .lens .grip{position:absolute;left:50%;top:7px;width:34px;height:4px;border-radius:2px;
    transform:translateX(-50%);background:rgba(230,220,255,.55)}

  /* ---- reveal: the number sits on top of the chosen card -------------- */
  .reveal{position:fixed;z-index:6;left:0;top:0;display:grid;place-items:center;
    opacity:0;pointer-events:none;transform:translate3d(0,0,0)}
  .reveal.on{opacity:1;pointer-events:auto;transition:opacity .3s}
  .badge{display:grid;place-items:center;gap:2px;padding:22px 30px 18px;border-radius:26px;
    background:rgba(11,22,32,.86);box-shadow:0 0 0 2px rgba(242,255,154,.8),0 0 60px rgba(242,255,154,.45),
      0 30px 60px rgba(0,0,0,.6);transform:scale(.6);opacity:0;
    transition:transform .45s cubic-bezier(.2,1.4,.4,1),opacity .25s}
  .reveal.on .badge{transform:scale(1);opacity:1}
  .badge .cap{font-size:11px;font-weight:900;letter-spacing:.32em;text-transform:uppercase;color:#C4B5FD}
  .badge .big{font-size:clamp(64px,22vw,120px);font-weight:900;line-height:1;color:#F2FF9A;
    text-shadow:0 0 12px #E9FF6A,0 0 36px rgba(201,255,63,.8),0 0 70px rgba(125,249,255,.6)}
  .badge .sub{font-size:12px;font-weight:700;color:#BFD8F5;margin-top:4px}
  .actions{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));z-index:7;
    display:flex;justify-content:center;gap:10px;padding:0 14px;opacity:0;pointer-events:none;
    transform:translate3d(0,14px,0);transition:opacity .3s,transform .3s}
  .actions.on{opacity:1;pointer-events:auto;transform:translate3d(0,0,0)}
  .actions .btn{padding:12px 16px;font-size:12.5px;letter-spacing:.06em}

  @media (prefers-reduced-motion: reduce){
    .card,.intro,.badge,.actions,.lens.snap{transition-duration:.01s}
  }
</style>
</head>

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
var stage=$('stage'), deck=$('deck'), intro=$('intro'), hint=$('hint');
var lens=$('lens'), ink=$('ink'), inkNum=$('inkNum'), reveal=$('reveal'), bigNum=$('bigNum'), actions=$('actions');
var cards=[].slice.call(deck.querySelectorAll('.card'));
var RATIO = 1242/585;           // brochure panel, height over width
var GAP = 14;

/* The numbers the four cards hide. The booth can set its own with
   ?numbers=5,10,20,50 -- any four short tokens, dealt out shuffled. */
var NUMBERS = (function(){
  try{
    var q = new URLSearchParams(location.search).get('numbers');
    if(q){
      var xs = q.split(',').map(function(s){ return s.trim().slice(0,4); }).filter(Boolean);
      if(xs.length >= 1) return xs.slice(0,4);
    }
  }catch(e){}
  return ['1','2','3','4'];
})();

var S = { phase:'intro', chosen:-1, numbers:[], number:'', spot:null, found:false, big:null, stageRect:null, revealed:{} };
var boothLink=$('boothLink'), cardsBtn=$('cardsBtn'), pickBtn=$('pickBtn');
/* Top-left is Booth while the four cards are showing and Cards once one has
   been taken out, so there is always one step back. */
function setPhase(ph){
  S.phase=ph;
  var one = ph==='choose' || ph==='search' || ph==='found';
  cardsBtn.hidden = !one; boothLink.hidden = one;
}

function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function setHint(t){ hint.textContent = t || ' '; }

/* ---- layout ----------------------------------------------------------- */
function layoutDeck(){
  var r = stage.getBoundingClientRect(); S.stageRect = r;
  var cols = r.width > r.height*1.15 ? 4 : 2, rows = 4/cols;
  var pad = 24;
  var byW = (r.width - pad - (cols-1)*GAP)/cols;
  var byH = ((r.height - pad - (rows-1)*GAP)/rows)/RATIO;
  var cw = Math.max(64, Math.floor(Math.min(byW, byH)));
  deck.style.setProperty('--cols', cols);
  deck.style.setProperty('--cw', cw+'px');
  deck.style.setProperty('--gap', GAP+'px');
}
/* Where the chosen card sits once it is on its own: as large as the stage
   allows with a margin below for the lens to rest in. */
function bigRect(){
  var r = S.stageRect || stage.getBoundingClientRect();
  var room = r.height < 420 ? 64 : 96;
  var h = Math.min(r.height - room, (r.width - 32)*RATIO);
  var w = h/RATIO;
  var x = r.left + (r.width - w)/2;
  var y = r.top + Math.max(10, (r.height - room - h)/2);
  return {x:x, y:y, w:w, h:h};
}
function lensSize(){
  var b = S.big; var w = Math.max(120, Math.min(220, Math.round(b.w*0.62)));
  return {w:w, h:Math.round(w*0.62)};
}
function applyBig(){
  var b = S.big = bigRect();
  var c = cards[S.chosen];
  c.style.left = b.x+'px'; c.style.top = b.y+'px'; c.style.width = b.w+'px'; c.style.height = b.h+'px';
  c.style.transform = 'none'; c.style.borderRadius = '22px';
  ink.style.width = b.w+'px'; ink.style.height = b.h+'px';
  inkNum.style.fontSize = Math.round(b.w*0.40)+'px';
  inkNum.style.left = (S.spot.fx*100)+'%'; inkNum.style.top = (S.spot.fy*100)+'%';
  var L = lensSize(); lens.style.width = L.w+'px'; lens.style.height = L.h+'px';
  reveal.style.left = b.x+'px'; reveal.style.top = b.y+'px'; reveal.style.width = b.w+'px'; reveal.style.height = b.h+'px';
  clampLens(); paintLens();
}

/* ---- the deal ---------------------------------------------------------- */
function deal(){
  setPhase('deal'); S.chosen=-1; S.found=false; S.spot=null; S.big=null; S.revealed={};
  S.numbers = shuffle(NUMBERS); while(S.numbers.length<4) S.numbers = S.numbers.concat(shuffle(NUMBERS));
  S.numbers = S.numbers.slice(0,4);
  reveal.classList.remove('on'); actions.classList.remove('on');
  lens.className='lens'; lens.style.transform='translate3d(-999px,-999px,0)';
  cards.forEach(function(c){ c.className='card dealing'; c.style.cssText=''; c.disabled=false; c.querySelector('.stamp').textContent=''; });
  pickBtn.hidden=false;
  layoutDeck();
  deck.classList.add('on');
  var sr = S.stageRect, cx = sr.left+sr.width/2, cy = sr.top+sr.height/2;
  var rects = cards.map(function(c){ return c.getBoundingClientRect(); });
  cards.forEach(function(c,i){
    var r = rects[i];
    c.style.transform = 'translate3d('+(cx-(r.left+r.width/2))+'px,'+(cy-(r.top+r.height/2))+'px,0) rotate('+((i%2?1:-1)*(6+i*3))+'deg) scale(.55)';
    c.style.opacity = '0';
  });
  void deck.offsetWidth;   // commit the stacked pose before animating out of it
  cards.forEach(function(c,i){
    c.classList.remove('dealing');
    c.style.transitionDelay = (i*70)+'ms';
    c.style.transform = 'translate3d(0,0,0)';
    c.style.opacity = '1';
  });
  setHint('Pick a card');
  setTimeout(function(){ if(S.phase==='deal'){ setPhase('pick'); cards.forEach(function(c){ c.style.transitionDelay=''; }); } }, 70*3+620);   // after the last card's 520ms slide has ended
}

/* ---- choose ------------------------------------------------------------ */
function choose(i){
  if(S.phase!=='pick' && S.phase!=='deal') return;
  if(S.revealed[i]!==undefined) return;
  setPhase('choose'); S.chosen=i; S.number=S.numbers[i]; S.found=false;
  S.spot = { fx: 0.28+Math.random()*0.44, fy: 0.16+Math.random()*0.66 };
  inkNum.textContent = S.number;
  cards.forEach(function(c){ c.disabled=true; c.style.transitionDelay=''; });
  var sr = S.stageRect || stage.getBoundingClientRect();
  var scx = sr.left+sr.width/2, scy = sr.top+sr.height/2;
  var rects = cards.map(function(c){ return c.getBoundingClientRect(); });
  var b = bigRect(); S.big=b;
  cards.forEach(function(c,k){
    var r = rects[k];
    if(k===i){
      c.classList.add('pick');
      var s = b.w/r.width;
      c.style.borderRadius = (22/s).toFixed(2)+'px';   // reads as 22px once scaled; no pop when it is pinned
      c.style.transform = 'translate3d('+((b.x+b.w/2)-(r.left+r.width/2))+'px,'+((b.y+b.h/2)-(r.top+r.height/2))+'px,0) scale('+s+')';
      c.style.zIndex = 3;
    }else{
      var dx = (r.left+r.width/2)-scx, dy=(r.top+r.height/2)-scy;
      var n = Math.max(1, Math.hypot(dx,dy));
      c.style.transform = 'translate3d('+(dx/n*sr.width*1.1)+'px,'+(dy/n*sr.height*0.9)+'px,0) rotate('+(dx>0?14:-14)+'deg) scale(.7)';
      c.classList.add('away');
    }
  });
  setHint('');
  setTimeout(lit, 560);
}
/* The chosen card has arrived. Pin it there as a fixed box (same pixels, no
   visible change) so the lens and the ink can share its coordinates, and the
   grid beneath can reflow unseen. */
function lit(){
  if(S.phase!=='choose') return;
  var c = cards[S.chosen];
  c.classList.add('big','lit'); c.classList.remove('pick'); c.style.zIndex='';
  cards.forEach(function(o,k){ if(k!==S.chosen) o.style.visibility='hidden'; });
  applyBig();
  var L = lensSize();
  lx = S.big.x + (S.big.w-L.w)/2; ly = S.big.y + S.big.h - L.h*0.55;
  clampLens(); paintLens();
  lens.classList.add('on');
  setPhase('search');
  setHint('Slide the UV card over the brochure');
}

/* ---- the lens ---------------------------------------------------------- */
var lx=0, ly=0, raf=0, grab=null, coverSince=0;
function clampLens(){
  var r = S.stageRect || stage.getBoundingClientRect(), L = lensSize();
  lx = Math.max(r.left+2, Math.min(r.left+r.width-L.w-2, lx));
  ly = Math.max(r.top+2, Math.min(r.top+r.height-L.h-2, ly));
}
function paintLens(){
  raf=0;
  lens.style.transform = 'translate3d('+lx+'px,'+ly+'px,0)';
  var b = S.big; if(!b) return;
  ink.style.transform = 'translate3d('+(b.x-lx)+'px,'+(b.y-ly)+'px,0)';
  if(S.phase==='search') check();
}
function schedule(){ if(!raf) raf=requestAnimationFrame(paintLens); }
function covered(){
  var b=S.big, L=lensSize();
  var nx = b.x + S.spot.fx*b.w, ny = b.y + S.spot.fy*b.h;
  var pad = Math.round(b.w*0.40)*0.22;
  return nx>lx+pad && nx<lx+L.w-pad && ny>ly+pad && ny<ly+L.h-pad;
}
function check(){
  if(S.phase!=='search' || !S.big || !S.spot) return;
  if(covered()){
    if(!coverSince){ coverSince=performance.now(); setTimeout(check, 330); }
    else if(performance.now()-coverSince>=300) found();
  }else coverSince=0;
}
function found(){
  if(S.phase!=='search') return;
  setPhase('found'); S.found=true; grab=null; coverSince=0;
  S.revealed[S.chosen]=S.number;
  cards[S.chosen].querySelector('.stamp').textContent=S.number;
  lens.classList.add('lock');
  try{ if(navigator.vibrate) navigator.vibrate(35); }catch(e){}
  setHint('Found it!');
  setTimeout(function(){
    bigNum.textContent = S.number;
    reveal.classList.add('on'); lens.classList.add('done'); actions.classList.add('on');
    pickBtn.hidden = Object.keys(S.revealed).length>=4;
    setHint('');
  }, 520);
}

/* ---- back to the four ----------------------------------------------------
   The reverse of choose(): the big card shrinks back into its slot in the
   row and the three that left slide back in. Numbers are kept -- this is
   the same deal. The card that was taken out comes back dimmed with its
   number stamped on it and out of play, whether or not the UV search got as
   far as finding it: choosing is the draw, the glass is only how it is
   shown, and a visitor who goes back early still wants to see what they
   drew before picking a second. */
function unchoose(){
  if(S.phase!=='search' && S.phase!=='found') return;
  var i=S.chosen, c=cards[i], b=S.big;
  setPhase('return'); grab=null; coverSince=0;
  S.revealed[i]=S.number;
  c.querySelector('.stamp').textContent=S.number;
  lens.className='lens'; lens.style.transform='translate3d(-999px,-999px,0)';
  reveal.classList.remove('on'); actions.classList.remove('on');
  layoutDeck();
  /* put the chosen card back in the flow, unseen, and read where it lands */
  c.className='card dealing'; c.style.cssText='';
  cards.forEach(function(o,k){ if(k!==i){ o.classList.add('dealing'); o.style.visibility=''; } });
  var rects = cards.map(function(o){ return o.getBoundingClientRect(); });
  var r=rects[i], sc=b.w/r.width;
  c.style.borderRadius=(22/sc).toFixed(2)+'px';
  c.style.transform='translate3d('+((b.x+b.w/2)-(r.left+r.width/2))+'px,'+((b.y+b.h/2)-(r.top+r.height/2))+'px,0) scale('+sc+')';
  c.style.zIndex=3;
  void deck.offsetWidth;
  cards.forEach(function(o,k){
    o.classList.remove('dealing');
    if(k===i){ o.style.transform='translate3d(0,0,0)'; o.style.borderRadius=''; }
    else{ o.classList.remove('away'); o.style.transform='translate3d(0,0,0)'; o.style.opacity='1'; }
    var done = S.revealed[k]!==undefined;
    o.classList.toggle('done', done); o.disabled=done;
  });
  var left = 4-Object.keys(S.revealed).length;
  setHint(left ? 'Pick another card' : 'All four revealed');
  setTimeout(function(){
    if(S.phase!=='return') return;
    c.style.zIndex='';
    setPhase('pick'); S.chosen=-1; S.big=null;
    if(!left){ pickBtn.hidden=true; actions.classList.add('on'); }
  }, 560);
}

stage.addEventListener('pointerdown', function(e){
  if(S.phase!=='search') return;
  if(e.button!==undefined && e.button!==0) return;
  e.preventDefault();
  var L = lensSize();
  var onLens = e.target===lens || lens.contains(e.target);
  if(onLens){ grab={id:e.pointerId, ox:e.clientX-lx, oy:e.clientY-ly}; }
  else{
    /* A finger landing anywhere brings the lens under it: nobody should
       have to hunt for a 180px card with a thumb. */
    grab={id:e.pointerId, ox:L.w/2, oy:L.h/2};
    lens.classList.add('snap');
    setTimeout(function(){ lens.classList.remove('snap'); }, 180);
    lx=e.clientX-grab.ox; ly=e.clientY-grab.oy; clampLens(); schedule();
  }
  try{ stage.setPointerCapture(e.pointerId); }catch(err){}
});
stage.addEventListener('pointermove', function(e){
  if(!grab || e.pointerId!==grab.id) return;
  lx=e.clientX-grab.ox; ly=e.clientY-grab.oy; clampLens(); schedule();
});
function release(e){ if(grab && e.pointerId===grab.id) grab=null; }
stage.addEventListener('pointerup', release);
stage.addEventListener('pointercancel', release);

/* ---- wiring ------------------------------------------------------------ */
$('startBtn').addEventListener('click', function(){
  if(S.phase!=='intro') return;
  intro.classList.add('gone');
  deal();
});
cards.forEach(function(c,i){ c.addEventListener('click', function(){ choose(i); }); });
$('againBtn').addEventListener('click', function(){ if(S.phase==='found' || S.phase==='pick') deal(); });
cardsBtn.addEventListener('click', unchoose);
pickBtn.addEventListener('click', unchoose);

function fitToWindow(){
  if(S.phase==='intro') return;
  layoutDeck();
  if(S.phase==='search' || S.phase==='found') applyBig();   // choose/return measure when they land
}
addEventListener('resize', fitToWindow);
addEventListener('orientationchange', function(){ fitToWindow(); setTimeout(fitToWindow,120); setTimeout(fitToWindow,400); });

/* Read-only view for the tests: no way in, only a look at what the game
   believes. */
window.__uv = {
  state: function(){ return {phase:S.phase, chosen:S.chosen, number:S.number, numbers:S.numbers.slice(), found:S.found, revealed:Object.assign({},S.revealed),
    big:S.big, lens:S.big ? {x:lx,y:ly,w:lensSize().w,h:lensSize().h} : null,
    spot:S.spot && S.big ? {x:S.big.x+S.spot.fx*S.big.w, y:S.big.y+S.spot.fy*S.big.h} : null}; }
};
layoutDeck();
})();
</script>
<script>
/* Registered from every page rather than only the home page: a visitor can
   arrive on any of them straight from a QR code, and whichever they land on
   is the one that has to work when the hall wifi does not. Failure is
   swallowed -- an unsupported browser or a file:// preview should lose the
   offline copy, not the page. */
if ('serviceWorker' in navigator)
  addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
</script>
</body>
</html>
